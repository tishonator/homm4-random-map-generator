# Builds the single-file program for Windows, Linux and macOS.
# - Every push and pull request: builds and uploads the programs as workflow artifacts.
# - A tag like v1.0.0: also publishes them on the repository's Releases page, where players
#   download them without needing to know anything about GitHub or Python.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: HoMM4RandomMap.exe
            asset: HoMM4RandomMap-windows.exe
          - os: ubuntu-latest
            file: HoMM4RandomMap
            asset: HoMM4RandomMap-linux
          - os: macos-latest
            file: HoMM4RandomMap
            asset: HoMM4RandomMap-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Check the generator writes valid maps
        shell: bash
        run: |
          mkdir -p smoke
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import generator
          for seed, players in ((1, 2), (2, 4)):
              settings = [{"human": i == 0, "faction": generator.FACTIONS[(seed + i) % 6], "hero": None}
                          for i in range(players)]
              print(generator.write_map(seed, 76, settings, "smoke"))
          EOF

      - name: Build the program
        run: pyinstaller --noconfirm HoMM4RandomMap.spec

      - name: Name the file for its system
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.file }}" "release/${{ matrix.asset }}"
          chmod +x "release/${{ matrix.asset }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset }}
